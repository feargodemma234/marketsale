<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Product - Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {background:#0f0f0f; color:white; font-family:Arial; padding:20px;}
    .container {max-width:600px; margin:0 auto;}
    .back {color:#00ff88; text-decoration:none; display:block; margin-bottom:20px; font-weight:bold;}
    h1 {color:#00ff88; margin-bottom:20px; text-align:center;}
    
    .form-box {background:#151515; padding:25px; border-radius:15px; border:1px solid #333;}
    .form-group {margin-bottom:18px;}
    .form-group label {display:block; margin-bottom:8px; color:#aaa; font-size:14px;}
    .form-group input, .form-group textarea {width:100%; padding:14px; background:#222; border:1px solid #333; border-radius:10px; color:white; font-size:15px;}
    .form-group textarea {min-height:100px; resize:vertical;}
    .btn-submit {background:#00ff88; color:#000; padding:16px; border-radius:10px; border:none; font-weight:bold; width:100%; font-size:16px; cursor:pointer;}
    .btn-submit:active {transform:scale(0.97); background:#00cc66;}
    
    /* WALLET PAYMENT BOX */
    .payment-box {display:none; background:#151515; padding:25px; border-radius:15px; border:1px solid #333; text-align:center; margin-top:20px;}
    .warning {background:#2a1f00; color:#ffaa00; padding:15px; border-radius:12px; margin-bottom:20px; text-align:left; font-size:13px;}
    .qr-box {background:white; padding:20px; border-radius:15px; display:inline-block; margin:15px 0;}
    .qr-box img {width:260px; height:260px;}
    .address-box {background:#1a1a1a; padding:18px; border-radius:12px; margin:20px 0; word-break:break-all;}
    .address {font-size:14px; color:#00ff88; font-family:monospace;}
    .btn-copy {background:#00ff88; color:#000; padding:14px 30px; border-radius:10px; border:none; font-weight:bold; cursor:pointer; width:100%;}
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back">← Back to Home</a>
  
  <div id="formSection">
    <h1 id="formTitle">Post Product - $2 Fee</h1>
    <div class="form-box">
      <form id="postForm">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" id="productName" required>
        </div>
        
        <div class="form-group">
          <label>Description *</label>
          <textarea id="productDesc" required></textarea>
        </div>
        
        <div class="form-group">
          <label>Email (Optional)</label>
          <input type="email" id="productEmail">
        </div>
        
        <div class="form-group">
          <label>WhatsApp Number *</label>
          <input type="text" id="productWhatsapp" placeholder="+234 800 000 0000" required>
        </div>
        
        <div class="form-group">
          <label>Price $ *</label>
          <input type="number" id="productPrice" step="0.01" required>
        </div>
        
        <button type="submit" id="submitBtn" class="btn-submit">Continue to Payment $2</button>
      </form>
    </div>
  </div>
  
  <!-- PAYMENT SECTION APPEARS AFTER FORM -->
  <div id="paymentSection" class="payment-box">
    <h1 style="color:#00ff88;">Pay $2 to Publish</h1>
    
    <div class="warning">
      ⚠️ Only send Tether USDT (TRC20) assets to this address. Other assets will be lost forever.
    </div>
    
    <div>US <b>USDT</b> <span style="background:#333; padding:2px 8px; border-radius:8px; font-size:12px;">TRC20</span></div>
    
    <div class="qr-box">
      <img id="qrCode" src="" alt="QR Code">
    </div>
    
    <div class="address-box">
      <div style="color:#aaa; font-size:12px; margin-bottom:8px;">USDT TRC20 Address</div>
      <div class="address" id="walletAddress">TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T</div>
      <button class="btn-copy" onclick="copyAddress()">📋 Copy</button>
    </div>
    
    <p style="color:#aaa; font-size:13px;">Send $2 USDT TRC20, then send screenshot to admin to approve your product.</p>
  </div>
</div>

<script>
if(localStorage.getItem("marketSaleLoggedIn") !== "true"){
  window.location.href = "login.html";
}

const MY_WALLET_ADDRESS = "TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T";
let productData = {};
let editData = JSON.parse(localStorage.getItem("editProduct"));

// LOAD DATA IF EDITING
if(editData){
  document.getElementById("formTitle").innerText = "Update Product - $2 Fee";
  document.getElementById("submitBtn").innerText = "Update Product $2";
  document.getElementById("productName").value = editData.title;
  document.getElementById("productDesc").value = editData.desc;
  document.getElementById("productEmail").value = editData.email;
  document.getElementById("productWhatsapp").value = editData.whatsapp;
  document.getElementById("productPrice").value = editData.price;
}

document.getElementById("postForm").addEventListener("submit", function(e){
  e.preventDefault();
  
  // SAVE FORM DATA TEMPORARILY
  productData = {
    name: document.getElementById("productName").value,
    desc: document.getElementById("productDesc").value,
    email: document.getElementById("productEmail").value,
    whatsapp: document.getElementById("productWhatsapp").value,
    price: document.getElementById("productPrice").value,
    seller: JSON.parse(localStorage.getItem("marketSaleUser")).name
  };
  
  // HIDE FORM, SHOW PAYMENT
  document.getElementById("formSection").style.display = "none";
  document.getElementById("paymentSection").style.display = "block";
  
  // GENERATE QR
  let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${MY_WALLET_ADDRESS}`;
  document.getElementById("qrCode").src = qrUrl;
  document.getElementById("walletAddress").innerText = MY_WALLET_ADDRESS;
  
  // SAVE PRODUCT AFTER 2 SECONDS - SIMULATE PAYMENT DONE
  setTimeout(saveProduct, 2000);
});

function saveProduct(){
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let newProduct;
  
  if(editData){ // UPDATING
    newProduct = {...editData, ...productData, title: productData.name, id: editData.id};
    products = products.map(p => p.id == editData.id ? newProduct : p);
    localStorage.removeItem("editProduct");
  } else { // NEW PRODUCT
    newProduct = {
      id: Date.now(),
      title: productData.name,
      desc: productData.desc,
      email: productData.email,
      whatsapp: productData.whatsapp,
      price: productData.price,
      seller: productData.seller,
      image: 'logo.png'
    };
    products.push(newProduct);
  }
  localStorage.setItem("marketSaleProducts", JSON.stringify(products));
  window.location.href = "index.html";
}

function copyAddress(){
  navigator.clipboard.writeText(MY_WALLET_ADDRESS);
}
</script>

</body>
</html>
