<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Product - Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; margin:0;}
    header {text-align:center; padding:20px; border-bottom:1px solid #333;}
    .nav a {color:#00ff88; margin:0 15px; text-decoration:none; font-weight:bold;}
    .container {max-width:700px; margin:30px auto; padding:20px;}
    input, textarea {width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #444; background:#1a1a1a; color:white; box-sizing:border-box;}
    .btn {background:#00ff88; color:#000; padding:12px 20px; border-radius:8px; border:none; font-weight:bold; cursor:pointer;}
    .pending {background:#151515; padding:15px; border-radius:10px; margin:10px 0; border:1px solid #333;}
    .pending span {background:#ff8800; padding:4px 8px; border-radius:6px; font-size:12px;}
  </style>
</head>
<body>
<script>
// FORCE LOGIN FIRST
if(!localStorage.getItem("marketSaleLoggedIn")){
  alert("Please login first");
  window.location.href = "login.html";
}
</script>

<header>
  <h1>📦 Post a Product</h1>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="post.html">Post Product</a>
    <a href="pay.html">Pay $2 Fee</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</header>

<div class="container">
  <h2>Add New Product</h2>
  <input type="text" id="title" placeholder="Product Title">
  <input type="number" id="price" placeholder="Price in $">
  <textarea id="desc" placeholder="Description"></textarea>
  <input type="text" id="whatsapp" placeholder="WhatsApp Number with country code">
  <input type="file" id="image" accept="image/*">
  <button class="btn" onclick="postProduct()">Post Product</button>

  <h3 style="margin-top:40px;">⏳ Pending Products - Tap to Approve</h3>
  <div id="pendingList"></div>
</div>

<script>
function postProduct() {
  let title = document.getElementById("title").value;
  let price = document.getElementById("price").value;
  let desc = document.getElementById("desc").value;
  let whatsapp = document.getElementById("whatsapp").value;
  let file = document.getElementById("image").files[0];
  
  if(!title || !price || !desc || !whatsapp || !file) return alert("Fill all fields");
  
  let reader = new FileReader();
  reader.onload = function(e) {
    let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
    let newProduct = {
      id: Date.now(),
      title, price, desc, whatsapp,
      image: e.target.result,
      approved: false
    };
    products.push(newProduct);
    localStorage.setItem("marketSaleProducts", JSON.stringify(products));
    alert("Product submitted! Waiting for approval.");
    showPending();
  };
  reader.readAsDataURL(file);
}

function showPending() {
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let pending = products.filter(p => !p.approved);
  document.getElementById("pendingList").innerHTML = pending.length === 0 ? "<p>No pending products</p>" :
  pending.map(p => `
    <div class="pending" onclick="approveProduct(${p.id})">
      <span>ID: ${p.id}</span>
      <h4>${p.title} - $${p.price}</h4>
      <p>Tap to enter approval key</p>
    </div>
  `).join("");
}

function approveProduct(id) {
  let key = prompt("Enter approval key:");
  if(key === "1234") {
    let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
    let p = products.find(x => x.id === id);
    if(p) p.approved = true;
    localStorage.setItem("marketSaleProducts", JSON.stringify(products));
    alert("Product Approved!");
    showPending();
  } else {
    alert("Wrong key");
  }
}

function logout(){
  localStorage.removeItem("marketSaleLoggedIn");
  alert("Logged out");
  location.href="login.html";
}

window.onload = showPending;
</script>
</body>
</html>
