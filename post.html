<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Product - Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; margin:0;}
    header {text-align:center; padding:20px; border-bottom:1px solid #333;}
  .logo {width:70px; height:70px; border-radius:15px; margin-bottom:10px;}
  .nav {display:flex; justify-content:center; gap:25px; margin-top:15px; flex-wrap:nowrap;}
  .nav a {color:#00ff88; text-decoration:none; font-weight:600; font-size:16px; white-space:nowrap;}
  .nav a.active {text-decoration:underline; font-weight:bold;}
  .container {max-width:600px; margin:40px auto; padding:20px;}
  .form {background:#151515; padding:25px; border-radius:15px; border:1px solid #333;}
  .form input,.form textarea {width:100%; padding:14px; margin:12px 0; border-radius:10px; border:1px solid #444; background:#1a1a1a; color:white; font-size:16px; box-sizing:border-box;}
  .form button {background:#00ff88; color:#000; padding:16px; border-radius:10px; border:none; font-size:18px; font-weight:bold; cursor:pointer; width:100%;}
   
   /* NEW MESSAGE BOX */
  .message {padding:15px; border-radius:10px; margin:15px 0; display:none; font-size:15px;}
  .message.success {background:#0a3d0a; color:#00ff88; border:1px solid #00ff88;}
  .message.error {background:#4a0f0f; color:#ff4444; border:1px solid #ff4444;}
  .message.info {background:#0a2a4a; color:#4da6ff; border:1px solid #4da6ff;}
   
  .admin-panel {background:#1a1a1a; padding:20px; border-radius:15px; margin-top:30px; border:2px solid #00ff88;}
  .admin-panel h3 {color:#00ff88; margin-top:0;}
    @media(max-width:600px){.nav {gap:15px;}.nav a {font-size:15px;}}
  </style>
</head>
<body>
<script>
if(!localStorage.getItem("marketSaleLoggedIn")){
  window.location.href = "login.html";
}
let currentUser = JSON.parse(localStorage.getItem("marketSaleUser"));
let isAdmin = currentUser && currentUser.email === "feargodemma56@gmail.com";
</script>

<header>
  <img src="logo.png" class="logo">
  <h1>Market Sale</h1>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="post.html" class="active">Post Product</a>
    <a href="pay.html">Pay $2 Fee</a>
  </div>
</header>

<div class="container">
  <h2>📦 Post Your Product</h2>
  
  <!-- MESSAGE BOX INSTEAD OF ALERT -->
  <div id="messageBox" class="message"></div>
  
  <div class="form">
    <input type="text" id="title" placeholder="Product Title">
    <input type="number" id="price" placeholder="Price in $">
    <textarea id="desc" placeholder="Product Description" rows="4"></textarea>
    <input type="text" id="whatsapp" placeholder="WhatsApp Number: 234XXXXXXXXXX">
    <input type="file" id="image" accept="image/*">
    <button onclick="submitProduct()">Submit for Approval</button>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="admin-panel" style="display:none;">
    <h3>🔐 Admin Panel - Approve Products</h3>
    <p style="color:#aaa;">Only you can see this. Enter the 3-word code to approve.</p>
    <input type="text" id="approveCode" placeholder="Enter code: market sale approve">
    <button onclick="approveProduct()" style="background:#007bff; color:white; margin-top:10px;">Approve</button>
    <div id="pendingList" style="margin-top:15px;"></div>
  </div>
</div>

<script>
function showMessage(text, type){
  let box = document.getElementById("messageBox");
  box.className = "message " + type;
  box.innerText = text;
  box.style.display = "block";
  setTimeout(() => {box.style.display = "none";}, 5000);
}

function submitProduct() {
  let title = document.getElementById("title").value;
  let price = document.getElementById("price").value;
  let desc = document.getElementById("desc").value;
  let whatsapp = document.getElementById("whatsapp").value;
  let imageFile = document.getElementById("image").files[0];

  if(!title ||!price ||!desc ||!whatsapp ||!imageFile) {
    showMessage("Please fill all fields and upload an image", "error");
    return;
  }

  let reader = new FileReader();
  reader.onload = function(e) {
    let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
    let newProduct = {
      id: Date.now(),
      title, price, desc, whatsapp,
      image: e.target.result,
      approved: false,
      postedBy: currentUser.email,
      views: 0
    };
    products.push(newProduct);
    localStorage.setItem("marketSaleProducts", JSON.stringify(products));
    
    // NO ALERT ANYMORE - SHOW TEXT ON SITE
    showMessage("First pay $2 on Pay page, then your product will be pending for admin approval", "info");
    
    document.getElementById("title").value = "";
    document.getElementById("price").value = "";
    document.getElementById("desc").value = "";
    document.getElementById("whatsapp").value = "";
    document.getElementById("image").value = "";
  };
  reader.readAsDataURL(imageFile);
}

function approveProduct() {
  let code = document.getElementById("approveCode").value.toLowerCase();
  if(code!== "market sale approve") {
    showMessage("Wrong approval code", "error");
    return;
  }
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let pending = products.find(p => p.approved === false);
  if(pending) {
    pending.approved = true;
    localStorage.setItem("marketSaleProducts", JSON.stringify(products));
    showMessage("Product approved successfully!", "success");
    loadPending();
  } else {
    showMessage("No pending products", "error");
  }
}

function loadPending() {
  if(!isAdmin) return;
  document.getElementById("adminPanel").style.display = "block";
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let pending = products.filter(p => p.approved === false);
  if(pending.length === 0) {
    document.getElementById("pendingList").innerHTML = "No pending products";
  } else {
    document.getElementById("pendingList").innerHTML = pending.map(p => `<div style="background:#0f0f0f; padding:10px; border-radius:8px; margin:5px 0;">${p.title} - $${p.price}</div>`).join("");
  }
}

window.onload = loadPending;
</script>
</body>
</html>
