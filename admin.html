<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {background:#0f0f0f; color:white; font-family:Arial; padding:20px;}
    .container {max-width:900px; margin:0 auto;}
    h1 {color:#00ff88; margin-bottom:20px; text-align:center;}
    .back {color:#00ff88; text-decoration:none; display:block; margin-bottom:20px;}
    
    .pending-card {background:#151515; border:1px solid #333; border-radius:15px; padding:15px; margin-bottom:15px;}
    .pending-img {width:100%; height:200px; object-fit:cover; border-radius:10px; margin-bottom:10px;}
    .pending-title {font-size:18px; font-weight:bold; color:#00ff88; margin-bottom:5px;}
    .pending-price {font-size:20px; font-weight:bold; margin-bottom:10px;}
    .pending-info {font-size:13px; color:#aaa; margin-bottom:5px;}
    .btn-approve {background:#00ff88; color:#000; padding:12px; border:none; border-radius:10px; width:100%; font-weight:bold; cursor:pointer; margin-bottom:8px;}
    .btn-reject {background:#ff4444; color:white; padding:12px; border:none; border-radius:10px; width:100%; font-weight:bold; cursor:pointer;}
    .empty {text-align:center; padding:60px; color:#666;}
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back">← Back to Site</a>
  <h1>🔒 Admin Panel - Pending Products</h1>
  <div id="pendingList"></div>
  <div id="emptyMsg" class="empty" style="display:none;">
    <h2>No pending products</h2>
  </div>
</div>

<script>
let pending = JSON.parse(localStorage.getItem("marketSalePending")) || [];
let approved = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
let list = document.getElementById("pendingList");

function loadPending(){
  if(pending.length === 0){
    document.getElementById("emptyMsg").style.display = "block";
    return;
  }
  
  list.innerHTML = pending.map(p => `
    <div class="pending-card">
      <img src="${p.image}" class="pending-img">
      <div class="pending-title">${p.title}</div>
      <div class="pending-price">$${p.price}</div>
      <div class="pending-info"><b>Seller:</b> ${p.seller}</div>
      <div class="pending-info"><b>Email:</b> ${p.email || 'N/A'}</div>
      <div class="pending-info"><b>WhatsApp:</b> ${p.whatsapp}</div>
      <div class="pending-info"><b>Desc:</b> ${p.desc}</div>
      <button class="btn-approve" onclick="approveProduct(${p.id})">✅ Approve & Publish</button>
      <button class="btn-reject" onclick="rejectProduct(${p.id})">❌ Reject</button>
    </div>
  `).join('');
}

function approveProduct(id){
  let product = pending.find(p => p.id == id);
  approved.push(product);
  pending = pending.filter(p => p.id != id);
  localStorage.setItem("marketSaleProducts", JSON.stringify(approved));
  localStorage.setItem("marketSalePending", JSON.stringify(pending));
  alert("Product Approved!");
  location.reload();
}

function rejectProduct(id){
  if(confirm("Reject this product?")){
    pending = pending.filter(p => p.id != id);
    localStorage.setItem("marketSalePending", JSON.stringify(pending));
    location.reload();
  }
}

loadPending();
</script>

</body>
</html>
