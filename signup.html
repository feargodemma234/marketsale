<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Market Sale</title>
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px;}
    .box {background:#151515; padding:40px 30px; border-radius:20px; width:100%; max-width:500px; border:1px solid #2a2a2a;}
    h2 {font-size:26px; text-align:center; margin:0 0 8px 0;}
    .subtitle {text-align:center; color:#aaa; font-size:15px; margin-bottom:25px;}
    input {width:100%; padding:18px; margin:12px 0; border-radius:12px; border:1px solid #333; background:#1a1a1a; color:white; font-size:17px; box-sizing:border-box;}
    input::placeholder {color:#666;}
    .example {text-align:center; color:#888; font-size:14px; margin-bottom:15px;}
    .btn {background:#00ff88; color:#000; padding:18px; border-radius:12px; border:none; width:100%; font-weight:bold; font-size:18px; cursor:pointer; margin-top:10px;}
    .trust {color:#00ff88; font-size:14px; text-align:center; margin:18px 0;}
    .warning {background:#3b0d0d; color:#ff7777; padding:15px; border-radius:10px; font-size:14px; margin:20px 0; display:flex; gap:8px;}
    .bottom-link {text-align:center; margin-top:15px;}
    .bottom-link a {color:#00ff88; font-size:16px; text-decoration:underline;}
  </style>
</head>
<body>
<div class="box">
  <h2>🔒 Create Account</h2>
  <p class="subtitle">Secure • Verified • Trusted</p>
  
  <input type="email" id="email" placeholder="Enter your Email" required>
  <input type="text" id="phrase" placeholder="Create 3-word secret phrase" required>
  <p class="example">Example: apple mango rice</p>
  
  <button class="btn" onclick="signup()">Sign Up</button>
  
  <p class="trust">✓ 100% Secure ✓ No Password Needed ✓ Fast Access</p>
  
  <div class="warning">
    <span>⚠️</span>
    <span>Important: We do NOT have access to your code. If you lose your 3-word phrase, we cannot recover your account.</span>
  </div>
  
  <div class="bottom-link">
    <a href="login.html">Already have account? Login</a>
  </div>
</div>
<script>
function signup() {
  let email = document.getElementById('email').value.trim();
  let phrase = document.getElementById('phrase').value.trim().toLowerCase();
  if(!email) return alert("Please enter email");
  if(phrase.split(' ').length !== 3) return alert("Phrase must be exactly 3 words");
  localStorage.setItem("marketSaleUser", JSON.stringify({email: email, phrase: phrase}));
  alert("Account Created Successfully!");
  window.location.href = "login.html";
}
</script>
</body>
</html>
