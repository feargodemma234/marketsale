<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;}
    .box {background:#151515; padding:30px; border-radius:15px; width:90%; max-width:400px; text-align:center; border:1px solid #333;}
    .logo {width:60px; height:60px; border-radius:12px; margin-bottom:10px;}
    input {width:100%; padding:14px; margin:10px 0; border-radius:8px; border:1px solid #444; background:#1a1a1a; color:white; box-sizing:border-box; font-size:15px;}
    .btn {background:#00ff88; color:#000; padding:14px; border-radius:8px; border:none; width:100%; font-weight:bold; font-size:16px; cursor:pointer; margin-top:10px;}
    .btn:hover {opacity:0.9;}
    .trust {color:#00ff88; font-size:13px; margin:15px 0;}
    .warning {background:#3b0d0d; color:#ff7777; padding:12px; border-radius:8px; font-size:12px; margin-top:15px; text-align:left;}
    a {color:#00ff88; text-decoration:none;}
  </style>
</head>
<body>
<div class="box">
  <img src="logo.png" class="logo">
  <h2>🔒 Create Trustworthy Account</h2>
  <p style="color:#aaa; font-size:14px;">Secure • Verified • Trusted</p>
  
  <input type="email" id="email" placeholder="Enter your Email" required>
  <input type="text" id="phrase" placeholder="Create 3-word secret phrase" required>
  <p style="font-size:12px; color:#888;">Example: apple mango rice. Keep it safe!</p>
  
  <button class="btn" onclick="signup()">Sign Up</button>
  
  <p class="trust">✓ 100% Secure  ✓ No Password Needed  ✓ Fast Access</p>
  
  <div class="warning">
    ⚠️ Important: We do NOT have access to your code. 
    If you lose your 3-word phrase, we cannot recover your account.
  </div>

  <p style="margin-top:20px;">Already have an account? <a href="login.html">Login</a></p>
</div>

<script>
function signup() {
  let email = document.getElementById('email').value.trim();
  let phrase = document.getElementById('phrase').value.trim().toLowerCase();
  
  if(!email) return alert("Please enter email");
  if(phrase.split(' ').length !== 3) return alert("Phrase must be exactly 3 words");
  
  localStorage.setItem("marketSaleUser", JSON.stringify({email: email, phrase: phrase}));
  alert("Account Created Successfully! You are verified.");
  window.location.href = "login.html";
}
</script>
</body>
</html>
