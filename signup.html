<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Market Sale</title>
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;}
    .box {background:#151515; padding:40px; border-radius:20px; width:90%; max-width:500px; text-align:center; border:1px solid #333;}
    h2 {font-size:28px; margin-bottom:20px;}
    input {width:100%; padding:18px; margin:15px 0; border-radius:10px; border:1px solid #444; background:#1a1a1a; color:white; font-size:16px; box-sizing:border-box;}
    .btn {background:#00ff88; color:#000; padding:18px; border-radius:10px; border:none; width:100%; font-weight:bold; font-size:18px; cursor:pointer;}
    .warning {background:#3b0d0d; color:#ff7777; padding:15px; border-radius:10px; font-size:14px; margin-top:20px; text-align:left;}
    .trust {color:#00ff88; font-size:15px; margin:20px 0;}
    a {color:#00ff88; font-size:16px;}
  </style>
</head>
<body>
<div class="box">
  <h2>🔒 Create Account</h2>
  <p style="color:#aaa; font-size:16px;">Secure • Verified • Trusted</p>
  
  <input type="email" id="email" placeholder="Enter your Email" required>
  <input type="text" id="phrase" placeholder="Create 3-word secret phrase" required>
  <p style="font-size:14px; color:#888;">Example: apple mango rice</p>
  
  <button class="btn" onclick="signup()">Sign Up</button>
  <p class="trust">✓ 100% Secure ✓ No Password Needed ✓ Fast Access</p>
  
  <div class="warning">
    ⚠️ Important: We do NOT have access to your code. 
    If you lose your 3-word phrase, we cannot recover your account.
  </div>
  <p><a href="login.html">Already have account? Login</a></p>
</div>
<script>
function signup() {
  let email = document.getElementById('email').value.trim();
  let phrase = document.getElementById('phrase').value.trim().toLowerCase();
  if(!email) return alert("Please enter email");
  if(phrase.split(' ').length !== 3) return alert("Phrase must be exactly 3 words");
  localStorage.setItem("marketSaleUser", JSON.stringify({email: email, phrase: phrase}));
  alert("Account Created Successfully!");
  window.location.href = "login.html";
}
</script>
</body>
</html>
