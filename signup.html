<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;}
    .box {background:#151515; padding:35px; border-radius:15px; width:90%; max-width:400px; border:1px solid #333; text-align:center;}
    .logo {width:80px; height:80px; border-radius:15px; margin-bottom:15px;}
    .box input {width:100%; padding:14px; margin:12px 0; border-radius:10px; border:1px solid #444; background:#1a1a1a; color:white; font-size:16px; box-sizing:border-box;}
    .box button {background:#00ff88; color:#000; padding:16px; border-radius:10px; border:none; font-size:18px; font-weight:bold; cursor:pointer; width:100%; margin-top:10px;}
    .box a {color:#00ff88; text-decoration:none;}
    .message {padding:14px; border-radius:10px; margin-bottom:15px; font-size:15px; text-align:left; display:none;}
    .message.success {background:#0a3d0a; color:#00ff88; border:1px solid #00ff88;}
    .message.error {background:#4a0f0f; color:#ff4444; border:1px solid #ff4444;}
    
    /* PASSWORD WITH EYE - same as login */
    .password-wrapper {position:relative; width:100%;}
    .password-wrapper input {padding-right:50px;}
    .toggle-eye {position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:20px; color:#888;}
  </style>
</head>
<body>
<div class="box">
  <img src="logo.png" class="logo">
  <h2>📝 Create Account</h2>
  <p style="color:#aaa; margin-bottom:20px;">Create your trustworthy account</p>
  <div id="messageBox" class="message"></div>
  
  <input type="text" id="name" placeholder="Full Name">
  <input type="email" id="email" placeholder="Email">
  
  <div class="password-wrapper">
    <input type="password" id="password" placeholder="Password - spaces allowed">
    <span class="toggle-eye" onclick="togglePassword()">👁️</span>
  </div>
  <p style="color:#888; font-size:12px; margin-top:-8px; text-align:left;">Example: my secret code</p>
  
  <button onclick="signup()">Sign Up</button>
  <p style="margin-top:20px; color:#aaa;">Already have account? <a href="login.html">Login</a></p>
  
  <p style="color:#00ff88; font-size:13px; margin-top:15px;">✓ Secure Access ✓ Instant Login ✓ Protected</p>
</div>

<script>
function showMessage(text, type){
  let box = document.getElementById("messageBox");
  box.className = "message " + type;
  box.innerText = text;
  box.style.display = "block";
  setTimeout(() => {box.style.display = "none";}, 3000);
}

function togglePassword(){
  let pass = document.getElementById("password");
  let eye = document.querySelector(".toggle-eye");
  if(pass.type === "password"){pass.type = "text"; eye.innerText = "🙈";} 
  else {pass.type = "password"; eye.innerText = "👁️";}
}

function signup() {
  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim().toLowerCase();
  let password = document.getElementById("password").value.trim(); // removes start/end spaces
  
  if(!name || !email || !password){
    showMessage("Please fill all fields", "error");
    return;
  }
  
  let users = JSON.parse(localStorage.getItem("marketSaleUsers")) || [];
  if(users.find(u => u.email === email)){
    showMessage("Email already exists", "error");
    return;
  }
  
  users.push({name, email, password});
  localStorage.setItem("marketSaleUsers", JSON.stringify(users));
  
  // NO ALERT - SHOW GREEN MESSAGE INSTEAD
  showMessage("Account Created Successfully! Redirecting...", "success");
  setTimeout(() => {window.location.href = "login.html";}, 1500);
}
</script>
</body>
</html>
