<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Sale - Home</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {background:#0f0f0f; color:white; font-family:Arial;}
    
    /* NAVBAR */
    .navbar {background:#151515; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; position:sticky; top:0; z-index:100;}
    .navbar .logo {width:40px; height:40px; border-radius:10px;}
    .nav-right {display:flex; align-items:center; gap:15px;}
    .welcome {color:#00ff88; font-weight:600; font-size:15px;}
    .btn-logout {background:#ff4444; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold;}
    
    /* HEADER */
    .header {padding:20px; display:flex; justify-content:space-between; align-items:center;}
    .btn-post {background:#00ff88; color:#000; padding:14px 25px; border-radius:10px; border:none; font-weight:bold; font-size:16px; cursor:pointer;}
    .btn-post:active {transform:scale(0.95);}
    
    /* PRODUCTS GRID */
    .container {padding:0 20px 30px; max-width:1200px; margin:0 auto;}
    .products {display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px;}
    .product-card {background:#151515; border-radius:15px; border:1px solid #333; overflow:hidden; cursor:pointer;}
    .product-card:active {border-color:#00ff88;}
    .product-img {width:100%; height:200px; background:#222; object-fit:cover;}
    .product-info {padding:15px;}
    .product-title {font-size:16px; font-weight:bold; margin-bottom:8px;}
    .product-price {color:#00ff88; font-size:18px; font-weight:bold;}
    .product-seller {font-size:12px; color:#aaa; margin-top:5px;}
    
    /* NO PRODUCTS */
    .empty {text-align:center; padding:60px 20px; color:#666;}
  </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <img src="logo.png" class="logo">
  <div class="nav-right">
    <span id="welcomeUser" class="welcome">Welcome</span>
    <button id="logoutBtn" class="btn-logout">Logout</button>
  </div>
</div>

<!-- HEADER WITH POST BUTTON -->
<div class="header">
  <h1 style="color:#00ff88;">Marketplace</h1>
  <button id="postBtn" class="btn-post">+ Post Product $2</button>
</div>

<!-- PRODUCTS -->
<div class="container">
  <div id="productsGrid" class="products">
    <!-- PRODUCTS WILL LOAD HERE -->
  </div>
  <div id="emptyMsg" class="empty" style="display:none;">
    <h2>No products yet</h2>
    <p>Be the first to post!</p>
  </div>
</div>

<script>
// PROTECT PAGE
if(localStorage.getItem("marketSaleLoggedIn") !== "true"){
  window.location.href = "login.html";
}

document.addEventListener("DOMContentLoaded", function(){
  let user = JSON.parse(localStorage.getItem("marketSaleUser"));
  if(user){
    document.getElementById("welcomeUser").innerText = "Welcome, " + user.name.toUpperCase();
  }
  
  // LOGOUT
  document.getElementById("logoutBtn").addEventListener("click", function(){
    localStorage.removeItem("marketSaleLoggedIn");
    localStorage.removeItem("marketSaleUser");
    window.location.href = "login.html";
  });
  
  // POST PRODUCT BUTTON - $2 FEE
  document.getElementById("postBtn").addEventListener("click", function(){
    let balance = parseFloat(localStorage.getItem("marketSaleBalance")) || 0;
    
    if(balance < 2){
      alert("You need $2 to post a product. Current balance: $" + balance.toFixed(2));
      // window.location.href = "wallet.html"; // send to wallet to fund
      return;
    }
    
    // Deduct $2 and go to post page
    localStorage.setItem("marketSaleBalance", balance - 2);
    window.location.href = "post-product.html";
  });
  
  loadProducts();
});

// LOAD PRODUCTS FROM LOCALSTORAGE
function loadProducts(){
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let grid = document.getElementById("productsGrid");
  let empty = document.getElementById("emptyMsg");
  
  if(products.length === 0){
    empty.style.display = "block";
    return;
  }
  
  grid.innerHTML = products.map(p => `
    <div class="product-card" onclick="viewProduct('${p.id}')">
      <img src="${p.image || 'placeholder.jpg'}" class="product-img">
      <div class="product-info">
        <div class="product-title">${p.title}</div>
        <div class="product-price">$${p.price}</div>
        <div class="product-seller">by ${p.seller}</div>
      </div>
    </div>
  `).join('');
}

function viewProduct(id){
  localStorage.setItem("viewProductId", id);
  window.location.href = "product-detail.html";
}
</script>

</body>
</html>
