<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Sale - Buy & Sell</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; margin:0;}
    header {text-align:center; padding:20px; border-bottom:1px solid #333; position:relative;}
   .logo {width:70px; height:70px; border-radius:15px; margin-bottom:10px;}
   .top-buttons {position:absolute; top:15px; right:15px; display:flex; gap:10px;}
   .top-buttons a {padding:8px 14px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:13px;}
   .btn-home {background:#00ff88; color:#000;}
   .btn-logout {background:#ff4444; color:white;}
   .btn-login {background:#007bff; color:white;}
   .nav {display:flex; justify-content:center; gap:25px; margin-top:15px; flex-wrap:nowrap;}
   .nav a {color:#00ff88; text-decoration:none; font-weight:600; font-size:16px; white-space:nowrap;}
   .nav a.active {text-decoration:underline; font-weight:bold;}
   .container {max-width:1200px; margin:30px auto; padding:20px;}
   .grid {display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px;}
   .card {background:#151515; border-radius:15px; padding:15px; border:1px solid #333; position:relative;}
   .card img {width:100%; height:200px; object-fit:cover; border-radius:10px; cursor:pointer;}
   .card h3 {margin:10px 0 5px 0; color:#00ff88;}
   .btn-wa {background:#25D366; color:white; padding:12px; border-radius:8px; text-decoration:none; display:block; text-align:center; margin-top:10px; font-weight:bold;}
   .id-badge {position:absolute; top:10px; left:10px; background:#00ff88; color:#000; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold;}
   .empty {text-align:center; color:#888; padding:40px;}
   .owner-btns {display:flex; gap:8px; margin-top:10px;}
   .btn-edit {background:#007bff; color:white; padding:10px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; flex:1;}
   .btn-delete {background:#ff4444; color:white; padding:10px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; flex:1;}
   .modal {display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:1000;}
   .modal-box {background:#151515; padding:25px; border-radius:15px; width:90%; max-width:500px; border:1px solid #333;}
   .modal-box input, .modal-box textarea {width:100%; padding:14px; margin:10px 0; border-radius:8px; border:1px solid #444; background:#1a1a1a; color:white; box-sizing:border-box;}
   
   /* ANALYTICS + VIEWS */
   .analytics {background:#1a1a1a; border:2px solid #00ff88; padding:20px; border-radius:15px; margin-bottom:30px;}
   .analytics h2 {color:#00ff88; margin-top:0;}
   .stats {display:grid; grid-template-columns:repeat(4, 1fr); gap:15px;}
   .stat-box {background:#0f0f0f; padding:20px; border-radius:10px; text-align:center; border:1px solid #333;}
   .stat-box.clickable {cursor:pointer; transition:0.2s;}
   .stat-box.clickable:hover {background:#222; border-color:#00ff88;}
   .stat-number {font-size:32px; font-weight:bold; color:#00ff88;}
   .stat-label {color:#aaa; font-size:14px; margin-top:5px;}
   .views {color:#aaa; font-size:13px; margin-top:5px; display:flex; align-items:center; gap:5px;}
    @media(max-width:600px){.nav {gap:15px;}.nav a {font-size:15px;} .stats {grid-template-columns:repeat(2, 1fr);}}
  </style>
</head>
<body>
<script>
let currentUser = JSON.parse(localStorage.getItem("marketSaleUser"));
let isAdmin = currentUser && currentUser.email === "feargodemma56@gmail.com";
let isLoggedIn = localStorage.getItem("marketSaleLoggedIn") === "true";

let visits = parseInt(localStorage.getItem("marketSaleVisits") || 0) + 1;
localStorage.setItem("marketSaleVisits", visits);
</script>

<header>
  <div class="top-buttons" id="topBtns">
    <a href="index.html" class="btn-home">🏠 Homepage</a>
  </div>
  <img src="logo.png" class="logo">
  <h1>Market Sale</h1>
  <div class="nav">
    <a href="index.html" class="active">Home</a>
    <a href="post.html">Post Product</a>
    <a href="pay.html">Pay $2 Fee</a>
  </div>
</header>

<div class="container">
  
  <!-- ADMIN ANALYTICS PANEL -->
  <div id="analyticsPanel" style="display:none;">
    <div class="analytics">
      <h2>📊 Admin Analytics</h2>
      <div class="stats" id="statsGrid"></div>
    </div>
  </div>

  <h2>🛒 Products For Sale</h2>
  <div class="grid" id="productGrid"></div>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <h3>Edit Product</h3>
    <input type="hidden" id="editId">
    <input type="text" id="editTitle" placeholder="Product Title">
    <input type="number" id="editPrice" placeholder="Price in $">
    <textarea id="editDesc" placeholder="Description" rows="4"></textarea>
    <input type="text" id="editWhatsapp" placeholder="WhatsApp Number">
    <button class="btn-edit" onclick="saveEdit()">Save Changes</button>
    <button class="btn-delete" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
if(isLoggedIn){
  document.getElementById("topBtns").innerHTML += `<a href="#" onclick="logout()" class="btn-logout">Logout</a>`;
} else {
  document.getElementById("topBtns").innerHTML += `<a href="login.html" class="btn-login">Login</a>`;
}

function loadAnalytics() {
  if(!isAdmin) return;
  document.getElementById("analyticsPanel").style.display = "block";
  
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let visits = localStorage.getItem("marketSaleVisits") || 0;
  let approved = products.filter(p => p.approved === true).length;
  let pending = products.filter(p => p.approved === false).length;
  let totalViews = products.reduce((sum, p) => sum + (p.views || 0), 0);
  
  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-box"><div class="stat-number">${visits}</div><div class="stat-label">Site Visits</div></div>
    <div class="stat-box"><div class="stat-number">${totalViews}</div><div class="stat-label">Total Product Views</div></div>
    <div class="stat-box"><div class="stat-number">${approved}</div><div class="stat-label">Approved Products</div></div>
    <a href="admin.html" class="stat-box clickable" style="text-decoration:none;">
      <div class="stat-number">${pending}</div><div class="stat-label">Pending Approval</div>
    </a>
  `;
}

function addView(id) {
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let p = products.find(x => x.id === id);
  if(p) {
    p.views = (p.views || 0) + 1;
    localStorage.setItem("marketSaleProducts", JSON.stringify(products));
  }
}

function loadProducts() {
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let approved = products.filter(p => p.approved === true);
  if(approved.length === 0) {
    document.getElementById("productGrid").innerHTML = `<div class="empty">No products yet. <a href="post.html" style="color:#00ff88;">Be the first to post!</a></div>`;
    return;
  }
  document.getElementById("productGrid").innerHTML = approved.map(p => `
    <div class="card">
      <div class="id-badge">ID: ${p.id}</div>
      <img src="${p.image}" alt="${p.title}" onclick="addView(${p.id}); loadProducts();">
      <h3>${p.title} - $${p.price}</h3>
      <p style="color:#aaa; font-size:14px;">${p.desc}</p>
      <div class="views">👁️ ${p.views || 0} views</div>
      <a class="btn-wa" href="https://wa.me/${p.whatsapp}?text=Hi, I'm interested in ${p.title}" target="_blank">💬 Contact Seller on WhatsApp</a>
      
      ${isLoggedIn && p.postedBy === currentUser.email ? `
      <div class="owner-btns">
        <button class="btn-edit" onclick="openEdit(${p.id})">✏️ Edit</button>
        <button class="btn-delete" onclick="deleteProduct(${p.id})">🗑️ Delete</button>
      </div>
      ` : ''}
    </div>
  `).join("");
}

function deleteProduct(id) {
  if(confirm("Are you sure you want to delete this product?")) {
    let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
    products = products.filter(p => p.id !== id);
    localStorage.setItem("marketSaleProducts", JSON.stringify(products));
    alert("Product deleted");
    loadProducts(); loadAnalytics();
  }
}

function openEdit(id) {
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let p = products.find(x => x.id === id);
  document.getElementById("editId").value = p.id;
  document.getElementById("editTitle").value = p.title;
  document.getElementById("editPrice").value = p.price;
  document.getElementById("editDesc").value = p.desc;
  document.getElementById("editWhatsapp").value = p.whatsapp;
  document.getElementById("editModal").style.display = "flex";
}

function saveEdit() {
  let id = parseInt(document.getElementById("editId").value);
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let p = products.find(x => x.id === id);
  
  p.title = document.getElementById("editTitle").value;
  p.price = document.getElementById("editPrice").value;
  p.desc = document.getElementById("editDesc").value;
  p.whatsapp = document.getElementById("editWhatsapp").value;
  
  localStorage.setItem("marketSaleProducts", JSON.stringify(products));
  alert("Product updated!");
  closeModal();
  loadProducts();
}

function closeModal() {
  document.getElementById("editModal").style.display = "none";
}

function logout(){localStorage.removeItem("marketSaleLoggedIn"); alert("Logged out"); location.href="index.html";}
window.onload = function(){
  loadProducts();
  loadAnalytics();
}
</script>
</body>
</html>
