<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Sale - Dashboard</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {background:#0f0f0f; color:white; font-family:Arial;}
    
    /* NAVBAR */
    .navbar {background:#151515; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; position:sticky; top:0; z-index:100;}
    .navbar .logo {width:40px; height:40px; border-radius:10px;}
    .nav-right {display:flex; align-items:center; gap:15px;}
    .welcome {color:#00ff88; font-weight:600; font-size:15px;}
    .btn-logout {background:#ff4444; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:14px;}
    .btn-logout:hover {background:#cc0000;}
    
    /* MAIN CONTENT */
    .container {padding:30px 20px; max-width:1200px; margin:0 auto;}
    .card {background:#151515; padding:25px; border-radius:15px; border:1px solid #333; margin-bottom:20px;}
    h1 {color:#00ff88; margin-bottom:10px;}
    p {color:#aaa; line-height:1.6;}
  </style>
</head>
<body>

<!-- PROTECTION SCRIPT - RUNS FIRST -->
<script>
// 1. PROTECT PAGE - If not logged in, go to login
if(localStorage.getItem("marketSaleLoggedIn") !== "true"){
  window.location.href = "login.html";
}

// 2. SHOW USER NAME WHEN PAGE LOADS
window.onload = function(){
  let user = JSON.parse(localStorage.getItem("marketSaleUser"));
  if(user){
    document.getElementById("welcomeUser").innerText = "Welcome, " + user.name;
  }
}

// 3. LOGOUT FUNCTION
function logout(){
  localStorage.removeItem("marketSaleLoggedIn");
  localStorage.removeItem("marketSaleUser");
  window.location.href = "login.html";
}
</script>

<!-- NAVBAR -->
<div class="navbar">
  <img src="logo.png" class="logo">
  
  <div class="nav-right">
    <span id="welcomeUser" class="welcome">Welcome</span>
    <button onclick="logout()" class="btn-logout">Logout</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="container">
  <div class="card">
    <h1>📊 Market Sale Dashboard</h1>
    <p>Welcome to your trustworthy account. This page is now protected.</p>
  </div>
  
  <div class="card">
    <h2 style="color:#00ff88; margin-bottom:15px;">Your Account</h2>
    <p>Only logged in users can see this page.</p>
  </div>
</div>

</body>
</html>
