<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {background: #0f0f0f; color: white; font-family: Arial; margin: 0; padding: 0;}
    header {text-align: center; padding: 20px; border-bottom: 1px solid #333;}
    .logo {width: 70px; height: 70px; border-radius: 15px;}
    .nav a {color: #00ff88; margin: 0 15px; text-decoration: none;}
    .container {max-width: 1200px; margin: auto; padding: 20px;}
    .product {border: 1px solid #333; padding: 15px; margin: 15px 0; border-radius: 10px; background: #1a1a1a;}
    .product img {width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 10px;}
    .product h3 {margin: 5px 0; color: #00ff88;}
    .id-badge {background: #28a745; padding: 3px 8px; border-radius: 5px; font-size: 12px;}
    a {color: #00aaff; text-decoration: none;}
  </style>
</head>
<body>

<header>
  <img src="logo.png" alt="Market Sale Logo" class="logo">
  <h1>Market Sale</h1>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="post.html">Post Product</a>
    <a href="pay.html">Pay $2 Fee</a>
  </div>
</header>

<div class="container">
  <h2>🛒 Products For Sale</h2>
  <div id="productList">
    <p>No approved products yet.</p>
  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
let approved = products.filter(p => p.approved === true);

function showProducts() {
  if(approved.length === 0) {
    document.getElementById("productList").innerHTML = "<p>No approved products yet.</p>";
    return;
  }
  document.getElementById("productList").innerHTML = approved.map(p => `
    <div class="product">
      <span class="id-badge">ID: ${p.id}</span>
      <img src="${p.image}" alt="${p.title}">
      <h3>${p.title} - $${p.price}</h3>
      <p>${p.desc}</p>
      <a href="https://wa.me/${p.whatsapp}" target="_blank">💬 Contact Seller on WhatsApp</a>
    </div>
  `).join("");
}

showProducts();
</script>

</body>
</html>
