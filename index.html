
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Sale - Buy & Sell</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; margin:0;}
    header {position:relative; text-align:center; padding:20px; border-bottom:1px solid #333;}
    .logo {width:70px; height:70px; border-radius:15px; margin-bottom:10px;}
    .top-buttons {position:absolute; top:15px; right:15px; display:flex; gap:10px;}
    .top-buttons a {padding:8px 14px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:13px;}
    .btn-home {background:#00ff88; color:#000;}
    .btn-login {background:#007bff; color:white;}
    .btn-signup {background:#00ff88; color:#000;}
    .btn-logout {background:#ff4444; color:white; display:none;}
    .nav a {color:#00ff88; margin:0 15px; text-decoration:none; font-weight:bold;}
    .nav a:hover {text-decoration:underline;}
    .container {max-width:1200px; margin:30px auto; padding:20px;}
    .grid {display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px;}
    .card {background:#151515; border-radius:15px; padding:15px; border:1px solid #333; position:relative;}
    .card img {width:100%; height:200px; object-fit:cover; border-radius:10px;}
    .card h3 {margin:10px 0 5px 0; color:#00ff88;}
    .price {color:#00ff88; font-size:20px; font-weight:bold;}
    .btn-wa {background:#25D366; color:white; padding:10px; border-radius:8px; text-decoration:none; display:block; text-align:center; margin-top:10px; font-weight:bold;}
    .id-badge {position:absolute; top:10px; left:10px; background:#00ff88; color:#000; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold;}
    .empty {text-align:center; color:#888; padding:40px;}
  </style>
</head>
<body>
<script>
// FORCE LOGIN FIRST
if(!localStorage.getItem("marketSaleLoggedIn")){
  alert("Please login first");
  window.location.href = "login.html";
}
</script>

<header>
  <!-- TOP RIGHT BUTTONS - This is your green box area -->
  <div class="top-buttons">
    <a href="index.html" class="btn-home">🏠 Homepage</a>
    <a href="login.html" id="loginBtn" class="btn-login">Login</a>
    <a href="signup.html" id="signupBtn" class="btn-signup">Sign Up</a>
    <a href="#" id="logoutBtn" onclick="logout()" class="btn-logout">Logout</a>
  </div>

  <img src="logo.png" class="logo">
  <h1>Market Sale</h1>
  
  <div class="nav" style="margin-top:15px;">
    <a href="index.html">Home</a>
    <a href="post.html">Post Product</a>
    <a href="pay.html">Pay $2 Fee</a>
  </div>
</header>

<div class="container">
  <h2>🛒 Products For Sale</h2>
  <div class="grid" id="productGrid"></div>
</div>

<script>
function loadProducts() {
  let products = JSON.parse(localStorage.getItem("marketSaleProducts")) || [];
  let approved = products.filter(p => p.approved === true);
  
  if(approved.length === 0) {
    document.getElementById("productGrid").innerHTML = `<div class="empty">No products yet. <a href="post.html" style="color:#00ff88;">Be the first to post!</a></div>`;
    return;
  }
  
  document.getElementById("productGrid").innerHTML = approved.map(p => `
    <div class="card">
      <div class="id-badge">ID: ${p.id}</div>
      <img src="${p.image}" alt="${p.title}">
      <h3>${p.title} - $${p.price}</h3>
      <p style="color:#aaa; font-size:14px;">${p.desc}</p>
      <a class="btn-wa" href="https://wa.me/${p.whatsapp}?text=Hi, I'm interested in ${p.title}" target="_blank">💬 Contact Seller on WhatsApp</a>
    </div>
  `).join("");
}

// Show/hide buttons based on login
if(localStorage.getItem("marketSaleLoggedIn")){
  document.getElementById("loginBtn").style.display = "none";
  document.getElementById("signupBtn").style.display = "none";
  document.getElementById("logoutBtn").style.display = "inline-block";
}

function logout(){
  localStorage.removeItem("marketSaleLoggedIn");
  alert("Logged out");
  location.href="login.html";
}

window.onload = loadProducts;
</script>
</body>
</html>
