<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {margin:0; padding:0; box-sizing:border-box;}
    body {background:#0f0f0f; color:white; font-family:Arial; padding:20px; min-height:100vh;}
    
    .box {background:#151515; padding:25px; border-radius:15px; border:1px solid #333; max-width:500px; margin:0 auto; text-align:center;}
    .back {color:#00ff88; text-decoration:none; display:block; text-align:left; margin-bottom:20px; font-weight:bold;}
    
    .warning {background:#2a1f00; color:#ffaa00; padding:15px; border-radius:12px; margin-bottom:20px; text-align:left; font-size:13px; border-left:3px solid #ffaa00;}
    
    .usdt-tag {display:inline-flex; align-items:center; gap:8px; background:#1a1a1a; padding:8px 16px; border-radius:20px; margin-bottom:20px; border:1px solid #333;}
    
    .qr-box {background:white; padding:20px; border-radius:15px; display:inline-block; margin:15px 0;}
    .qr-box img {width:260px; height:260px;}
    
    .address-box {background:#1a1a1a; padding:18px; border-radius:12px; margin:20px 0; word-break:break-all; border:1px solid #333;}
    .address-label {color:#aaa; font-size:12px; margin-bottom:8px; text-align:center;}
    .address {font-size:14px; color:#00ff88; font-family:monospace; text-align:center; margin-bottom:12px;}
    
    .btn-copy {background:#00ff88; color:#000; padding:14px 30px; border-radius:10px; border:none; font-weight:bold; cursor:pointer; width:100%; font-size:16px;}
    .btn-copy:active {transform:scale(0.97); background:#00cc66;}
    
    .note {color:#aaa; font-size:13px; margin-top:20px; text-align:left;}
  </style>
</head>
<body>

<a href="index.html" class="back">← Back to Home</a>

<div class="box">
  <h1 style="color:#00ff88; margin-bottom:15px;">Receive</h1>
  
  <!-- WARNING -->
  <div class="warning">
    ⚠️ Only send Tether USDT (TRC20) assets to this address. Other assets will be lost forever.
  </div>
  
  <!-- USDT TAG -->
  <div class="usdt-tag">
    <span>US</span>
    <b>USDT</b>
    <span style="background:#333; padding:2px 8px; border-radius:8px; font-size:12px;">TRC20</span>
  </div>
  
  <!-- QR CODE -->
  <div class="qr-box">
    <img id="qrCode" src="" alt="QR Code">
  </div>
  
  <!-- ADDRESS -->
  <div class="address-box">
    <div class="address-label">USDT TRC20 Address</div>
    <div class="address" id="walletAddress">PASTE_YOUR_ADDRESS_HERE</div>
    <button class="btn-copy" onclick="copyAddress()">📋 Copy</button>
  </div>
  
  <div class="note">
    No memo required <br><br>
    After payment, send screenshot to admin to credit your account for $2 posting fee.
  </div>
</div>

<script>
// PROTECT PAGE
if(localStorage.getItem("marketSaleLoggedIn") !== "true"){
  window.location.href = "login.html";
}

// CHANGE THIS TO YOUR REAL USDT TRC20 ADDRESS FROM YOUR SCREENSHOT
const MY_WALLET_ADDRESS = "TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T";

document.addEventListener("DOMContentLoaded", function(){
  // SET ADDRESS
  document.getElementById("walletAddress").innerText = MY_WALLET_ADDRESS;
  
  // GENERATE QR CODE
  let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${MY_WALLET_ADDRESS}`;
  document.getElementById("qrCode").src = qrUrl;
});

// COPY ADDRESS
function copyAddress(){
  navigator.clipboard.writeText(MY_WALLET_ADDRESS);
  alert("✅ Address Copied!");
}
</script>

</body>
</html>
