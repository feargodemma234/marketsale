<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Market Sale</title>
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;}
    .box {background:#151515; padding:40px; border-radius:20px; width:90%; max-width:500px; text-align:center; border:1px solid #333;}
    h2 {font-size:28px; margin-bottom:20px;}
    input {width:100%; padding:18px; margin:15px 0; border-radius:10px; border:1px solid #444; background:#1a1a1a; color:white; font-size:16px; box-sizing:border-box;}
    .btn {background:#007bff; color:white; padding:18px; border-radius:10px; border:none; width:100%; font-weight:bold; font-size:18px; cursor:pointer;}
    .trust {color:#00ff88; font-size:15px; margin:20px 0;}
    a {color:#00ff88; font-size:16px;}
  </style>
</head>
<body>
<div class="box">
  <h2>🔐 Login</h2>
  <p style="color:#aaa; font-size:16px;">Login to your trustworthy account</p>
  
  <input type="email" id="email" placeholder="Enter your Email" required>
  <input type="text" id="phrase" placeholder="Enter your 3-word phrase" required>
  
  <button class="btn" onclick="login()">Login</button>
  <p class="trust">✓ Secure Access ✓ Instant Login ✓ Protected</p>
  <p><a href="signup.html">Don't have account? Sign Up</a></p>
</div>
<script>
function login() {
  let email = document.getElementById('email').value.trim();
  let phrase = document.getElementById('phrase').value.trim().toLowerCase();
  let user = JSON.parse(localStorage.getItem("marketSaleUser"));
  if(user && user.email === email && user.phrase === phrase) {
    localStorage.setItem("marketSaleLoggedIn", "true");
    alert("Login Successful!");
    window.location.href = "index.html";
  } else {
    alert("Wrong email or phrase");
  }
}
</script>
</body>
</html>
