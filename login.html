<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;}
    .box {background:#151515; padding:30px; border-radius:15px; width:90%; max-width:400px; text-align:center; border:1px solid #333;}
    .logo {width:60px; height:60px; border-radius:12px; margin-bottom:10px;}
    input {width:100%; padding:14px; margin:10px 0; border-radius:8px; border:1px solid #444; background:#1a1a1a; color:white; box-sizing:border-box; font-size:15px;}
    .btn {background:#007bff; color:white; padding:14px; border-radius:8px; border:none; width:100%; font-weight:bold; font-size:16px; cursor:pointer; margin-top:10px;}
    .btn:hover {opacity:0.9;}
    .trust {color:#00ff88; font-size:13px; margin:15px 0;}
    a {color:#00ff88; text-decoration:none;}
  </style>
</head>
<body>
<div class="box">
  <img src="logo.png" class="logo">
  <h2>🔐 Secure Login</h2>
  <p style="color:#aaa; font-size:14px;">Login to your trustworthy account</p>
  
  <input type="email" id="email" placeholder="Enter your Email" required>
  <input type="text" id="phrase" placeholder="Enter your 3-word phrase" required>
  
  <button class="btn" onclick="login()">Login</button>
  
  <p class="trust">✓ Secure Access  ✓ Instant Login  ✓ Protected</p>
  
  <p style="margin-top:20px;">Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
function login() {
  let email = document.getElementById('email').value.trim();
  let phrase = document.getElementById('phrase').value.trim().toLowerCase();
  let user = JSON.parse(localStorage.getItem("marketSaleUser"));
  
  if(user && user.email === email && user.phrase === phrase) {
    localStorage.setItem("marketSaleLoggedIn", "true");
    alert("Login Successful! Welcome back.");
    window.location.href = "index.html";
  } else {
    alert("Wrong email or phrase. Please try again.");
  }
}
</script>
</body>
</html>
