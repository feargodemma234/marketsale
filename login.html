<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Market Sale</title>
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px;}
    .box {background:#151515; padding:40px 30px; border-radius:20px; width:100%; max-width:500px; border:1px solid #2a2a2a;}
    h2 {font-size:26px; text-align:center; margin:0 0 8px 0;}
    .subtitle {text-align:center; color:#aaa; font-size:15px; margin-bottom:25px;}
    input {width:100%; padding:18px; margin:12px 0; border-radius:12px; border:1px solid #333; background:#1a1a1a; color:white; font-size:17px; box-sizing:border-box;}
    input::placeholder {color:#666;}
    .btn {background:#007bff; color:white; padding:18px; border-radius:12px; border:none; width:100%; font-weight:bold; font-size:18px; cursor:pointer; margin-top:10px;}
    .trust {color:#00ff88; font-size:14px; text-align:center; margin:18px 0;}
    .bottom-link {text-align:center; margin-top:15px;}
    .bottom-link a {color:#00ff88; font-size:16px; text-decoration:underline;}
  </style>
</head>
<body>
<div class="box">
  <h2>🔐 Login</h2>
  <p class="subtitle">Login to your trustworthy account</p>
  
  <input type="email" id="email" placeholder="Enter your Email" required>
  <input type="text" id="phrase" placeholder="Enter your 3-word phrase" required>
  
  <button class="btn" onclick="login()">Login</button>
  
  <p class="trust">✓ Secure Access ✓ Instant Login ✓ Protected</p>
  
  <div class="bottom-link">
    <a href="signup.html">Don't have account? Sign Up</a>
  </div>
</div>
<script>
function login() {
  let email = document.getElementById('email').value.trim();
  let phrase = document.getElementById('phrase').value.trim().toLowerCase();
  let user = JSON.parse(localStorage.getItem("marketSaleUser"));
  if(user && user.email === email && user.phrase === phrase) {
    localStorage.setItem("marketSaleLoggedIn", "true");
    alert("Login Successful!");
    window.location.href = "index.html";
  } else {
    alert("Wrong email or phrase");
  }
}
</script>
</body>
</html>
