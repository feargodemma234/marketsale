<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Market Sale</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {background:#0f0f0f; color:white; font-family:Arial; margin:0; display:flex; justify-content:center; align-items:center; height:100vh;}
    .box {background:#151515; padding:35px; border-radius:15px; width:90%; max-width:400px; border:1px solid #333; text-align:center;}
    .logo {width:80px; height:80px; border-radius:15px; margin-bottom:15px;}
    .box input {width:100%; padding:14px; margin:12px 0; border-radius:10px; border:1px solid #444; background:#1a1a1a; color:white; font-size:16px; box-sizing:border-box;}
    .box button {background:#00ff88; color:#000; padding:16px; border-radius:10px; border:none; font-size:18px; font-weight:bold; cursor:pointer; width:100%; margin-top:10px;}
    .box a {color:#00ff88; text-decoration:none;}
    
    /* MESSAGE BOX */
    .message {padding:15px; border-radius:10px; margin:15px 0; display:none; font-size:15px; text-align:left;}
    .message.success {background:#0a3d0a; color:#00ff88; border:1px solid #00ff88;}
    .message.error {background:#4a0f0f; color:#ff4444; border:1px solid #ff4444;}
  </style>
</head>
<body>
<div class="box">
  <img src="logo.png" class="logo">
  <h2>🔐 Login</h2>
  <p style="color:#aaa;">Login to your trustworthy account</p>
  
  <!-- MESSAGE BOX INSTEAD OF ALERT -->
  <div id="messageBox" class="message"></div>
  
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p style="margin-top:20px; color:#aaa;">Don't have account? <a href="signup.html">Sign Up</a></p>
  
  <p style="color:#00ff88; font-size:13px; margin-top:20px;">✓ Secure Access ✓ Instant Login ✓ Protected</p>
</div>

<script>
function showMessage(text, type){
  let box = document.getElementById("messageBox");
  box.className = "message " + type;
  box.innerText = text;
  box.style.display = "block";
}

function login() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  let users = JSON.parse(localStorage.getItem("marketSaleUsers")) || [];
  let user = users.find(u => u.email === email && u.password === password);
  
  if(user) {
    localStorage.setItem("marketSaleLoggedIn", "true");
    localStorage.setItem("marketSaleUser", JSON.stringify(user));
    
    // NO ALERT ANYMORE - SHOW GREEN MESSAGE
    showMessage("Login Successful! Redirecting...", "success");
    
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1500);
    
  } else {
    showMessage("Invalid email or password", "error");
  }
}
</script>
</body>
</html>
